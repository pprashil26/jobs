'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],DB='LifeJobsDB',VER=1,APP='Life Jobs',FMT=1;let db,jobs=[],snaps=[],statusFilter='all',archived=false,currentId=null,confirmResolve=null;const now=()=>new Date().toISOString(),today=()=>now().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').trim().toLowerCase().replace(/\?.*$/,'').replace(/\/$/,'');
function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2400)}function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,VER);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains('jobs'))d.createObjectStore('jobs',{keyPath:'id'});if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function os(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function req(q){return new Promise((r,j)=>{q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}const getAll=n=>req(os(n).getAll()),get=(n,k)=>req(os(n).get(k)),put=(n,v)=>req(os(n,'readwrite').put(v)),remove=(n,k)=>req(os(n,'readwrite').delete(k)),clear=n=>req(os(n,'readwrite').clear());async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function verifiedPut(j){await put('jobs',j);let x=await get('jobs',j.id);if(!x||JSON.stringify(x)!==JSON.stringify(j))throw Error('Read-back verification failed')}async function refresh(){jobs=await getAll('jobs');snaps=(await getAll('snapshots')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));localStorage.setItem('lifeJobsRecoveryMirrorV1',JSON.stringify({savedAt:now(),jobs}));renderAll()}async function snapshot(reason){let payload={jobs:structuredClone(jobs)},s={id:crypto.randomUUID(),createdAt:now(),reason,payload};s.checksum=await hash(JSON.stringify(payload));await put('snapshots',s);let a=(await getAll('snapshots')).sort((x,y)=>y.createdAt.localeCompare(x.createdAt));for(let x of a.slice(20))await remove('snapshots',x.id)}
function fmt(v){if(!v)return'—';let d=new Date(v.length===10?v+'T00:00:00':v);return d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}function label(s){return s?s[0].toUpperCase()+s.slice(1):''}function showView(n){$$('.view').forEach(v=>v.classList.toggle('active',v.id===n+'View'));$$('.nav').forEach(v=>v.classList.toggle('active',v.dataset.view===n));if(n==='capture')setTimeout(()=>$('#capturePaste').focus(),20);if(n==='activity')renderActivity();if(n==='settings')renderSettings()}function show(id){$('#'+id).classList.add('show')}function hide(id){$('#'+id).classList.remove('show')}
function renderAll(){renderChips();renderJobs();renderActivity();renderSettings();$('#companies').innerHTML=[...new Set(jobs.map(j=>j.company).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join('')}function renderChips(){let states=['all','interested','applied','interview','offer'];$('#chips').innerHTML=states.map(s=>`<button class="chip ${s===statusFilter?'active':''}" data-status="${s}">${s.toUpperCase()} · ${jobs.filter(j=>!j.archived&&(s==='all'||j.status===s)).length}</button>`).join('')}function list(){let a=jobs.filter(j=>!!j.archived===archived);if(statusFilter!=='all')a=a.filter(j=>j.status===statusFilter);let q=norm($('#search').value);if(q)a=a.filter(j=>norm([j.title,j.company,j.location,(j.tags||[]).join(' '),j.notes].join(' ')).includes(q));let s=$('#sourceFilter').value,m=$('#modeFilter').value;if(s)a=a.filter(j=>j.source===s);if(m)a=a.filter(j=>j.workMode===m);let o=$('#sortFilter').value;a.sort((x,y)=>o==='updated'?y.updatedAt.localeCompare(x.updatedAt):o==='closing'?(x.closingDate||'9999').localeCompare(y.closingDate||'9999'):o==='company'?x.company.localeCompare(y.company):o==='title'?x.title.localeCompare(y.title):y.capturedAt.localeCompare(x.capturedAt));return a}function card(j){return`<article class="panel job" data-id="${j.id}"><h3>${esc(j.title)}</h3><div class="company">${esc(j.company)}</div><div class="meta">${esc([j.location,j.workMode,j.salaryText].filter(Boolean).join(' · '))}</div><div class="meta">${esc((j.source||'other').toUpperCase())} · <span class="badge ${j.status}">${label(j.status)}</span> · Saved ${fmt(j.capturedAt)}</div><button class="open">›</button></article>`}function renderJobs(){let a=list();$('#jobCount').textContent=`${a.length} ${archived?'archived':'active'} job${a.length===1?'':'s'}`;$('#archiveToggle').textContent=archived?'ACTIVE':'ARCHIVED';$('#jobsList').innerHTML=a.length?a.map(card).join(''):'<div class="empty"><strong>No jobs found</strong>Capture a job or change the filters.</div>'}function renderActivity(){let a=jobs.filter(j=>!j.archived&&(j.followUpDate||['applied','interview','offer'].includes(j.status))).sort((x,y)=>(x.followUpDate||'9999').localeCompare(y.followUpDate||'9999'));$('#activityList').innerHTML=a.length?a.map(card).join(''):'<div class="empty"><strong>No activity yet</strong>Applications and follow-ups appear here.</div>'}function renderSettings(){$('#summary').textContent=`${jobs.filter(j=>!j.archived).length} active · ${jobs.filter(j=>j.archived).length} archived · ${snaps.length} snapshots`;$('#discoveryUrl').value=localStorage.getItem('lifeJobsDiscoveryUrl')||''}
const formIds=['title','company','location','workMode','source','status','sourceUrl','salaryText','postedDate','closingDate','appliedAt','followUpDate','tags','notes','description'];function openEditor(data={}){$('#jobId').value=data.id||'';for(let id of formIds)$('#'+id).value=id==='tags'?(data.tags||[]).join(', '):(data[id]??'');if(!data.source)$('#source').value='other';if(!data.status)$('#status').value='interested';$('#editorTitle').textContent=data.id?'EDIT JOB':'CAPTURE JOB';hide('detail');show('editor')}function fromForm(){let id=$('#jobId').value,old=jobs.find(j=>j.id===id),st=$('#status').value;return{id:old?.id||crypto.randomUUID(),title:$('#title').value.trim(),company:$('#company').value.trim(),location:$('#location').value.trim(),workMode:$('#workMode').value,source:$('#source').value,status:st,sourceUrl:$('#sourceUrl').value.trim(),salaryText:$('#salaryText').value.trim(),postedDate:$('#postedDate').value||null,closingDate:$('#closingDate').value||null,appliedAt:$('#appliedAt').value||(st==='applied'&&!old?.appliedAt?today():old?.appliedAt)||null,followUpDate:$('#followUpDate').value||null,tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),notes:$('#notes').value.trim(),description:$('#description').value.trim(),capturedAt:old?.capturedAt||now(),updatedAt:now(),archived:old?.archived||false}}async function saveJob(e){e?.preventDefault();let j=fromForm();if(!j.title||!j.company)return toast('Title and company are required');let exact=jobs.find(x=>x.id!==j.id&&j.sourceUrl&&norm(x.sourceUrl)===norm(j.sourceUrl));if(exact)return toast('This URL is already saved');try{await verifiedPut(j);await refresh();hide('editor');showView('jobs');toast(j.id===currentId?'Job updated safely':'Job saved safely')}catch(x){console.error(x);toast('Save failed. Existing data was not changed')}}
function openDetail(id){let j=jobs.find(x=>x.id===id);if(!j)return;currentId=id;$('#detailBody').innerHTML=`<div class="panel"><span class="badge ${j.status}">${label(j.status)}</span><h1>${esc(j.title)}</h1><div class="company">${esc(j.company)}</div><div class="meta">${esc([j.location,j.workMode,j.salaryText].filter(Boolean).join(' · '))}</div><div class="actions">${j.sourceUrl?'<button id="openOriginal" class="btn primary">OPEN ORIGINAL</button>':''}<button id="archiveJob" class="btn">${j.archived?'RESTORE':'ARCHIVE'}</button></div></div><div class="panel timeline"><div><small>Saved</small>${fmt(j.capturedAt)}</div><div><small>Updated</small>${fmt(j.updatedAt)}</div><div><small>Applied</small>${fmt(j.appliedAt)}</div><div><small>Follow-up</small>${fmt(j.followUpDate)}</div></div>${j.notes?`<div class="panel"><div class="stitle">NOTES</div>${esc(j.notes).replace(/\n/g,'<br>')}</div>`:''}<div class="panel"><button id="deleteJob" class="btn danger block">DELETE PERMANENTLY</button></div>`;show('detail');$('#openOriginal')?.addEventListener('click',()=>window.open(j.sourceUrl,'_blank','noopener'));$('#archiveJob').onclick=async()=>{await snapshot('Before archive change');await verifiedPut({...j,archived:!j.archived,updatedAt:now()});await refresh();hide('detail');toast('Archive updated')};$('#deleteJob').onclick=async()=>{if(!await confirmBox('Delete permanently?',`${j.title} at ${j.company}`,'DELETE'))return;await snapshot('Before delete');await remove('jobs',j.id);await refresh();hide('detail');toast('Job deleted')}}function confirmBox(t,x,y){return new Promise(r=>{confirmResolve=r;$('#confirmTitle').textContent=t;$('#confirmText').textContent=x;$('#confirmYes').textContent=y;$('#confirm').showModal()})}
function detect(t){t=t.toLowerCase();return t.includes('linkedin.com')?'linkedin':t.includes('seek.com')?'seek':t.includes('indeed.')?'indeed':t.includes('adzuna.')?'adzuna':'other'}function parse(t){let lines=t.split(/\n+/).map(x=>x.trim()).filter(Boolean),url=(t.match(/https?:\/\/[^\s]+/)||[''])[0],clean=lines.filter(x=>!x.startsWith('http'));return{title:clean[0]||'',company:clean[1]||'',source:detect(t),sourceUrl:url,description:url&&t.trim()===url?'':t.trim(),status:'interested'}}function discoveryUrl(){return(localStorage.getItem('lifeJobsDiscoveryUrl')||'').replace(/\/$/,'')}async function discover(){let base=discoveryUrl();if(!base){toast('Set Worker URL in Settings');return showView('settings')}$('#discoverState').textContent='Searching…';try{let u=new URL(base+'/search');u.searchParams.set('keywords',$('#discoverWhat').value.trim());u.searchParams.set('location',$('#discoverWhere').value.trim());let r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error(String(r.status));let d=await r.json(),a=Array.isArray(d.results)?d.results:[];window.discovered=a;$('#discoverState').textContent=`${a.length} jobs found`;$('#discoverResults').innerHTML=a.map((j,i)=>`<article class="panel job"><h3>${esc(j.title)}</h3><div class="company">${esc(j.company)}</div><div class="meta">${esc([j.location,j.salaryText].filter(Boolean).join(' · '))}</div><div class="actions"><button class="btn saveResult" data-i="${i}">REVIEW & SAVE</button></div></article>`).join('')}catch(e){$('#discoverState').textContent='Discovery unavailable. Saved jobs are unaffected.';toast('Adzuna search unavailable')}}
async function backup(){let core={app:APP,formatVersion:FMT,exportedAt:now(),jobs,settings:{discoveryUrl:discoveryUrl()}},out={...core,checksum:await hash(JSON.stringify(core))},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download=`life-jobs-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function restore(f){try{let d=JSON.parse(await f.text()),{checksum,...core}=d;if(d.app!==APP||d.formatVersion!==FMT||await hash(JSON.stringify(core))!==checksum)throw Error('Invalid backup');if(!await confirmBox('Restore backup?',`${d.jobs.length} jobs will replace current data.`,'RESTORE'))return;await snapshot('Before restore');await clear('jobs');for(let j of d.jobs)await verifiedPut(j);await refresh();toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}finally{$('#restoreFile').value=''}}async function recovery(){snaps=(await getAll('snapshots')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));$('#recoveryList').innerHTML=snaps.length?snaps.map(s=>`<div class="panel"><strong>${fmt(s.createdAt)} · ${esc(s.reason)}</strong><div class="meta">${s.payload.jobs.length} jobs</div><button class="btn restoreSnap" data-id="${s.id}">RESTORE</button></div>`).join(''):'<div class="empty">No snapshots yet.</div>';show('recovery')}
$$('.nav').forEach(b=>b.onclick=()=>showView(b.dataset.view));$('#settingsTop').onclick=()=>showView('settings');$('#quickAdd').onclick=()=>showView('capture');$('#filterBtn').onclick=()=>$('#filters').hidden=!$('#filters').hidden;$('#search').oninput=renderJobs;['sourceFilter','modeFilter','sortFilter'].forEach(id=>$('#'+id).onchange=renderJobs);$('#chips').onclick=e=>{let b=e.target.closest('[data-status]');if(b){statusFilter=b.dataset.status;renderAll()}};$('#archiveToggle').onclick=()=>{archived=!archived;statusFilter='all';renderAll()};$('#manualCapture').onclick=()=>openEditor({status:'interested',source:'other'});$('#capturePaste').oninput=e=>$('#detected').textContent=e.target.value?detect(e.target.value).toUpperCase()+' DETECTED':'';$('#reviewCapture').onclick=()=>{let t=$('#capturePaste').value.trim();if(t)openEditor(parse(t));else toast('Paste a URL or job details')};$('#jobForm').onsubmit=saveJob;$('#saveTop').onclick=saveJob;$$('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));$('#jobsList').onclick=e=>{let j=e.target.closest('[data-id]');if(j)openDetail(j.dataset.id)};$('#activityList').onclick=e=>{let j=e.target.closest('[data-id]');if(j)openDetail(j.dataset.id)};$('#editJob').onclick=()=>openEditor(jobs.find(j=>j.id===currentId));$('#saveDiscoveryUrl').onclick=()=>{let v=$('#discoveryUrl').value.trim();if(v&&!/^https:\/\//i.test(v))return toast('Use an HTTPS URL');localStorage.setItem('lifeJobsDiscoveryUrl',v.replace(/\/$/,''));toast('Worker URL saved')};$('#discoverSearch').onclick=discover;$('#discoverResults').onclick=e=>{let b=e.target.closest('.saveResult');if(!b)return;let j=window.discovered[+b.dataset.i];openEditor({title:j.title||'',company:j.company||'',location:j.location||'',salaryText:j.salaryText||'',description:j.description||'',postedDate:(j.postedDate||'').slice(0,10),sourceUrl:j.sourceUrl||'',source:'adzuna',status:'interested'})};$('#backupBtn').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>e.target.files[0]&&restore(e.target.files[0]);$('#recoveryBtn').onclick=recovery;$('#recoveryList').onclick=async e=>{let b=e.target.closest('.restoreSnap');if(!b)return;let s=snaps.find(x=>x.id===b.dataset.id);if(await hash(JSON.stringify(s.payload))!==s.checksum)return toast('Snapshot verification failed');if(!await confirmBox('Restore snapshot?',`${s.payload.jobs.length} jobs`,'RESTORE'))return;await snapshot('Before snapshot restore');await clear('jobs');for(let j of s.payload.jobs)await verifiedPut(j);await refresh();hide('recovery');toast('Snapshot restored')};$('#confirmNo').onclick=()=>{$('#confirm').close();confirmResolve?.(false)};$('#confirmYes').onclick=()=>{$('#confirm').close();confirmResolve?.(true)};(async()=>{try{db=await openDB();await refresh()}catch(e){console.error(e);toast('Storage could not be opened')}})();
</script></body></html>
